name: Label by app

# Adds the app's label to a new issue, from the "App" field of the issue form.
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const match = body.match(/### App\s+([^\n]+)/);
            if (!match) return;
            const labels = {
              'com.narwal.global': 'app: narwal',
              'il.co.switcher': 'app: switcher',
              'com.pal-es': 'app: palgate',
              'il.co.tzevaadom': 'app: red alert',
            };
            const id = (match[1].match(/\(([^)]+)\)/) || [])[1];
            const label = labels[id];
            if (!label) return;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: [label],
            });
